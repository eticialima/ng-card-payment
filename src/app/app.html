<div class="app-container">

  <main class="app-main">
    <mat-stepper linear #stepper>
      <!-- Passo 1: Seleção do Método -->
      <mat-step
        label="Escolha o método de pagamento"
        [completed]="canProceed()"
      >
        <div class="step-content">
          <app-payment-method-selector
            [selectedMethod]="selectedPaymentMethod()"
            (methodSelected)="onMethodSelected($event)"
          />
        </div>
      </mat-step>

      <!-- Passo 2: Preenchimento dos Dados -->
      <mat-step
        label="Dados de pagamento"
        [completed]="showingStatus()"
        [editable]="canProceed()"
      >
        <div class="step-content">
          @if (selectedPaymentMethod() === 'credit_card') {
            <h2>Cartão de Crédito</h2>
            <app-payment-card [isDebit]="false" (back)="onBack()" (submit)="onPaymentSubmit()" />
          }

          @if (selectedPaymentMethod() === 'debit_card') {
            <h2>Cartão de Débito</h2>
            <app-payment-card [isDebit]="true" (back)="onBack()" (submit)="onPaymentSubmit()" />
          }

          @if (selectedPaymentMethod() === 'pix') {
            <h2>Pagamento PIX</h2>
            <app-payment-pix (back)="onBack()" (pixPaid)="onPaymentSubmit()" />
          }
        </div>
      </mat-step>

      <!-- Passo 3: Status do Pagamento -->
      <mat-step
        label="Status"
        [editable]="showingStatus()"
      >
        <div class="step-content">
          @if (showingStatus()) {
            <app-status-payment
              [status]="paymentStatus()"
              [message]="paymentMessage()"
              [details]="paymentDetails()"
              [transactionId]="transactionId()"
              [paymentMethod]="selectedPaymentMethod() || undefined"
              (retry)="onPaymentRetry()"
              (close)="onPaymentClose()"
              (newPayment)="onNewPayment()"
            />
          }
        </div>
      </mat-step>
    </mat-stepper>
  </main>
</div>
